[package]
name = "custom_taskbar"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "custom_taskbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
png = "0.18"
base64 = "0.23"
hidapi = "2.6.7"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "query", "json"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62" # needed by the #[implement] macro expansion
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
  "Win32_System_Com", "Win32_System_Threading",
  "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_EnhancedStorage", "Win32_System_Variant",
  "Media_Control", "Storage_Streams", "Foundation",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery",
  "Win32_Networking_NetworkListManager", "Networking_Connectivity",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
